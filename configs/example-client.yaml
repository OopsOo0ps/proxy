# proxy-client 示例配置（生产模板）。
# 字段说明见 Wiki「配置参考」；未知字段会导致启动失败（严格解析）。

inbound:
  # 本机入站代理，两者至少启用一个。
  http: "127.0.0.1:8080"
  socks5: "127.0.0.1:1080"
  # 入站认证（HTTP Proxy-Authorization / SOCKS5 用户名密码）。
  # 监听非环回地址时必填；环回地址建议也填写，防止本机其它程序滥用。
  auth:
    - username: alice
      password: change-me

# 出口节点（Trojan over TLS）；建议至少 3 个以保证可用性。
# 密码采用 SHA-224 摘要接入隧道，请使用强口令并与服务端 users 对应。
nodes:
  - addr: "node1.example.com:443"
    password: node1-token
    sni: www.example.com   # 可选：TLS SNI / 证书校验名
  - addr: "node2.example.com:443"
    password: node2-token
  - addr: "node3.example.com:443"
    password: node3-token

# 上游空闲隧道连接池（预热复用）：请求优先领取已握手的空闲连接，省去一次完整握手。
pool:
  max_idle: 2   # 每个节点保留的最大空闲连接数；0 = 关闭
  idle_ttl: 5s  # 空闲连接最长保留时间；应小于服务端 timeouts.handshake（默认 10s）

# 出口节点主动健康检查（上游故障自愈）：按周期做 TCP+TLS 握手探测，
# 连续失败 failures 次后摘除该节点（不再参与拨号），摘除后连续成功
# successes 次自动加回。interval: 0 可关闭主动探测（仅保留被动冷却切换）；
# 探测不发送 Trojan 请求、不校验口令（口令错误由真实流量被动兜底）。
health_check:
  interval: 10s   # 探测周期；0 = 关闭
  timeout: 3s     # 单次探测超时
  failures: 3     # 连续失败 N 次后摘除
  successes: 2    # 摘除后连续成功 M 次加回

# 过载保护：进程级并发连接上限（HTTP + SOCKS5 合计）；0 = 不限制。
# 超限时 HTTP 入站回 503、SOCKS5 回 0x05 0xFF；拒绝计入 connections_rejected_total。
limits:
  max_connections: 1024

# 连接出口节点的 TLS 参数。
tls:
  ca_file: ""                 # 使用自签证书时填写 CA 证书路径
  insecure_skip_verify: false # 仅调试使用：跳过证书校验

# 分流：未命中规则时的默认动作；规则文件中的 default 会覆盖此值。
# 规则源二选一：本地 rules_file 或远程 rules_url（同时配置会报错）。
routing:
  default: proxy
  rules_file: ""        # 本地规则文件，例如 configs/example-rules.yaml
  rules_url: ""         # 远程规则 URL（仅 http/https），例如 "https://rules.example.com/proxy-rules.yaml"
  # rules_refresh_interval: 30m  # 远程规则刷新周期（缺省 30m；0 = 仅启动拉取一次）
  private_direct: true  # 环回 / 私网 / 链路本地 / 组播目标一律直连

# DNS 网关（可选）：把本机 DNS 查询纳入分流——代理名字经出口节点远程解析
# （DNS over TCP 走隧道），直连名字转发给本机解析器。详见 Wiki「DNS-策略」。
# 不启用时保留 listen 为空即可；仅允许监听环回地址（避免成为开放解析器）。
dns:
  listen: ""             # 例如 "127.0.0.1:53"（53 端口需要 root 或 CAP_NET_BIND_SERVICE）
  # remote: "1.1.1.1:53" # 经出口节点访问的 DNS 服务器；缺省 1.1.1.1:53，应选择从出口可达的地址（如 223.5.5.5:53）
  # local:               # 直连名字使用的本机解析器；留空 = 启动时读取 /etc/resolv.conf
  #   - "192.168.1.1:53"
  # timeout: 5s          # 单次查询超时

# 超时。纯数字按秒解释。
timeouts:
  dial: 10s       # 建立目标 / 节点连接
  handshake: 10s  # 隧道握手（TLS + Trojan）
  idle: 90s       # 连接空闲回收
  failover: 30s   # 出口节点故障转移总预算（全部候选节点合计；直连路径不受影响）
  shutdown: 15s   # 优雅关停：停止接受新连接后，等待存量请求结束的最长时间

# 指标与运维端点（/metrics、/health、/stats）；建议只监听本机或置于防火墙之后。
metrics:
  listen: "127.0.0.1:9100"

# 日志：json | text；级别 debug | info | warn | error。
log:
  level: info
  format: json

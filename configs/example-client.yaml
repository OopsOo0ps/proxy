# proxy-client 示例配置（生产模板）。
# schema 形状：判别字段列表 + 协议自有 params（未知字段会导致启动失败——严格解析）。
# 字段说明见 Wiki「配置参考」。

# 日志：级别 debug | info | warn | error；格式 json | text。
log:
  level: info
  format: json

# 运维端点（/metrics、/health、/stats、/log/level）。
# 默认仅允许监听环回地址；确需远程只读访问时显式加 allow-remote: true
#（PUT /log/level 永远只限环回来源）。
api:
  listen: "127.0.0.1:9100"
  # allow-remote: false

# 入站端点（列表 + 判别字段 type：http | socks5 | dns）。
# 共性认证 auth 对 http / socks5 生效；监听非环回地址时必填，
# 环回地址建议也填写，防止本机其它程序滥用。dns 网关不允许 auth。
inbounds:
  - type: http
    listen: "127.0.0.1:8080"    # HTTP/HTTPS 入站（CONNECT + 绝对地址请求）
    auth:
      users:
        - username: alice
          password: change-me
  - type: socks5
    listen: "127.0.0.1:1080"    # SOCKS5 入站（TCP CONNECT）
    auth:
      users:
        - username: alice
          password: change-me
  # DNS 网关（可选）：把本机 DNS 查询纳入分流——代理名字经出口节点远程解析
  # （DNS over TCP 走隧道），直连名字转发给本机解析器。详见 Wiki「DNS-策略」。
  # 仅允许监听环回地址（避免成为开放解析器）；53 端口需要 root 或
  # CAP_NET_BIND_SERVICE。解析策略参数见下方 routing.dns。
  # - type: dns
  #   listen: "127.0.0.1:1053"

# 出站侧：出口节点列表（判别字段 protocol）+ 节点池策略。
outbound:
  nodes:
    # trojan 自有参数（协议校验在协议构造器）：addr 必填，password 必填；
    # sni / ca-file / insecure-skip-verify 可选。口令以 SHA-224 摘要接入
    # 隧道，请使用强口令并与服务端 users 对应。建议至少 3 个节点保证可用性。
    - name: edge-1
      protocol: trojan
      params:
        addr: "node1.example.com:443"
        password: node1-token
        sni: www.example.com   # 可选：TLS SNI / 证书校验名，省缺取 addr 主机名
    - name: edge-2
      protocol: trojan
      params:
        addr: "node2.example.com:443"
        password: node2-token
    - name: edge-3
      protocol: trojan
      params:
        addr: "node3.example.com:443"
        password: node3-token
        # ca-file: /etc/proxy/ca.pem          # 自签证书场景：自定义 CA
        # insecure-skip-verify: false         # 仅调试使用：跳过证书校验

  # 节点池策略（协议无关）。
  pool:
    # 预热池：请求优先领取已握手的空闲连接，省去一次完整握手。
    # size = 0 关闭；ttl 应小于服务端握手超时（缺省 10s）。
    prewarm:
      size: 2
      ttl: 5s
    # 主动健康检查：按周期做 TCP+TLS 握手探测，连续失败 failures 次摘除
    #（不再参与拨号），摘除后连续成功 successes 次自动加回。
    # interval: 0 关闭主动探测（仅保留真实拨号失败的被动冷却切换）。
    # 探测不发送 Trojan 请求、不校验口令（口令错误由真实流量被动兜底）。
    health:
      interval: 10s
      timeout: 3s
      failures: 3
      successes: 2
    # 出口节点故障转移总预算（全部候选节点合计；直连路径不受影响）。
    failover-budget: 30s

# 分流：内联规则（按顺序匹配，先命中者生效）+ 可选规则源。
routing:
  # 环回 / 私网 / 链路本地目标一律直连（硬规则，规则不可覆盖）。
  private-direct: true
  rules:
    # match 词表：domain（裸域）| domain-suffix（子域，不含裸域）| ip | cidr。
    # action 词表：direct | proxy | reject。{ default: ... } 指定缺省动作。
    - { match: domain-suffix, value: cn, action: direct }
    - { match: cidr, value: 10.0.0.0/8, action: direct }
    - { default: proxy }
  # 规则源（来源可替换，当前至多一个；与内联规则按序组合匹配）。
  # type 省缺 url（定时刷新，失败保持现有规则）；远程源仅允许 https
  # （明文 http 仅环回地址可用，本地演示场景）；file 为本地文件（构建期
  # 严格读取），文件格式与 configs/example-rules.yaml 一致。
  # rulesets:
  #   - name: cn-list
  #     url: "https://rules.example.com/proxy-rules.yaml"
  #     interval: 24h              # 刷新周期；省缺 30m
  #     # sha256: <64-hex expected digest>   # 可选：内容钉扎摘要，
  #     #          拉取内容与它不一致时按刷新失败处理（保留现有规则）
  #   - name: local
  #     type: file
  #     path: configs/example-rules.yaml
  # DNS 网关解析策略（网关本身是上方 type: dns 入站）。
  # dns:
  #   remote: "1.1.1.1:53"   # 经出口节点访问的 DNS 服务器；省缺 1.1.1.1:53，
  #                          # 应选择从出口可达、支持 TCP 的地址（如 223.5.5.5:53）
  #   local:                 # 直连名字使用的本机解析器；省缺读取 /etc/resolv.conf
  #     - "192.168.1.1:53"
  #   timeout: 5s            # 单次查询超时

# 过载保护：进程级并发连接上限（全部入站合计）；0 = 不限制。
# 超限时 HTTP 入站回 503、SOCKS5 回 0x05 0xFF；拒绝计入 connections_rejected_total。
limits:
  max-connections: 1024

# 超时。纯数字按秒解释。
timeouts:
  dial: 10s       # 建立目标 / 节点连接
  handshake: 10s  # 隧道握手（TLS + Trojan）
  idle: 90s       # 连接空闲回收
  shutdown: 15s   # 优雅关停：停止接受新连接后，等待存量请求结束的最长时间

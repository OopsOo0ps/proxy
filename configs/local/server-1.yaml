# 本地演示节点 1（监听 18443）。
# 证书由 make dev-cert 生成到 var/（make demo-up 会自动执行）。

log:
  level: info
  format: json

api:
  listen: "127.0.0.1:19201"

inbounds:
  - type: trojan
    listen: "127.0.0.1:18443"
    params:
      cert-file: var/dev-cert.pem
      key-file: var/dev-key.pem
      users:
        - username: alice
          password: local-node-1

# proxy-server 示例配置（生产模板）。
# schema 形状：判别字段列表 + 协议自有 params（未知字段会导致启动失败——严格解析）。
# 服务端 = trojan 隧道入站 + 直连出站的特化：没有 routing / ruleset / 节点池。

# 日志：级别 debug | info | warn | error；格式 json | text。
log:
  level: info
  format: json

# 运维端点（/metrics、/health、/stats、/log/level）。
# 默认仅允许监听环回地址；确需远程只读访问时显式加 allow-remote: true
#（PUT /log/level 永远只限环回来源）。
api:
  listen: "127.0.0.1:9200"
  # allow-remote: false

# 控制面（用户/订阅管理 API）。只允许环回监听，无 allow-remote 类逃生口；
# 监听地址登记进端口冲突集。缺省整个段 = 控制面不启用。
control:
  listen: "127.0.0.1:9300"

# 账户库（accounts 模式：动态用户/订阅存储，经控制面管理）。
# 段存在即启用账户模式，并与静态凭据互斥——启用前必须删除 trojan 入站
# params 里的 users 列表（身份命名空间唯一，否则启动失败）。账户文件为
# 版本化 JSON，严格加载：文件缺失/损坏即启动失败，空账户列表合法；
# 形状示例见 configs/example-accounts.json。控制面端点：POST/GET /users、
# PATCH /users/{name}、PUT /users/{name}/subscription。
accounts:
  file: configs/example-accounts.json

# 支付（订阅门禁的订单与网关侧）。段存在即启用支付，要求 accounts 与 control
# 同时存在（订阅延长落在账户库、notify 回调由控制面承载 POST /notify/alipay）；
# 段省略 = 不启用支付。网关地址与 notify 目标均为配置注入（设计书 §1.3）。
# 注意：下方密钥是本地演示材料，由 make dev-keys 生成到 var/（已 gitignore，
# 永不提交仓库；缺失时先执行 make dev-keys——商户私钥 + 商户公钥给 mockpay
# 验签请求，网关私钥给 mockpay 签发通知）。生产部署必须替换为真实商户私钥
# （权限 0600，永不提交仓库）与支付宝开放平台下发的公钥。
payment:
  # 支付宝网关基地址：必须 HTTPS。真支付宝为 https://openapi.alipay.com/gateway.do；
  # 本地演示指向 mockpay（bin/mockpay -listen 127.0.0.1:9400 ...，自签证书用
  # curl -k 访问；8443 已被上方 trojan 入站占用，示例改用 9400）。
  gateway_url: "https://127.0.0.1:9400/gateway.do"
  # 商户应用 ID（与 mockpay 默认接受的 app_id 一致）。
  app_id: "2026000000000000"
  # 商户 RSA2 私钥（PKCS#8，请求签名）与支付宝公钥（PKIX，异步通知验签）。
  # 两者都由 make dev-keys 生成到 var/（gitignored，见上方说明）。
  merchant_key_file: var/alipay-merchant-key.pem
  alipay_public_key_file: var/alipay-gateway-pub.pem
  # 异步通知回调：控制面环回端点（与上方 control.listen 同一监听）。
  notify_url: "http://127.0.0.1:9300/notify/alipay"
  # 订单库（版本化 JSON）。文件缺失 = 空库，首次运行合法（与 accounts.file
  # 的缺失即拒启动不同）；var/ 已 gitignore，落盘内容不进版本库。
  orders_file: var/orders.json
  # 固定单一档位：订阅时长（天，> 0）与价格（分，> 0）。
  period_days: 30
  price_cents: 3000

# 入站端点（列表 + 判别字段 type；服务端为 trojan 隧道接受器，可配置多个）。
# 建议通过防火墙/安全组限制来源；生产可监听 443 以融入普通 HTTPS 流量。
inbounds:
  - type: trojan
    listen: "0.0.0.0:8443"
    params:
      # 隧道 TLS 证书与私钥（必填）。示例指向 make dev-cert 生成的本地证书；
      # 生产部署替换为 /etc/proxy/server.crt 等实际路径。
      cert-file: var/dev-cert.pem
      key-file: var/dev-key.pem
      # 隧道凭据：accounts 模式下不配置静态 users 列表（与账户库互斥），
      # 用户经控制面（POST /users）创建并持久化到 accounts.file。
      # 服务端只保留 SHA-224 摘要；认证失败时返回中性伪装页面
      #（不泄露任何代理信息），可用 decoy-file 自定义页面。
      # decoy-file: /etc/proxy/decoy.html
      # ↑ 建议显式配置自定义伪装页面：未配置时使用内置伪装页（仅适用于
      #   本地试验——内置模板是公开的固定内容，可能被指纹识别），此时启动
      #   会记录一条 warning。

# 过载保护：进程级并发隧道上限；0 = 不限制。
# 超限连接直接关闭（TLS 层无法携带错误语义），并计入 connections_rejected_total。
limits:
  max-connections: 1024

# 超时。纯数字按秒解释。
timeouts:
  dial: 10s       # 建立目标连接（服务端即出口，直连拨号）
  handshake: 10s  # 隧道握手（TLS + Trojan）
  idle: 90s       # 连接空闲回收
  shutdown: 15s   # 优雅关停：停止接受新连接后，等待存量隧道结束的最长时间
